<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body style="background:#fff;">
<div class="print-page">
  <div class="print-header">
    <div>
      <h2>{{ title }}</h2>
      <div class="muted">أكاديمية فوق — رايحين فوق! · تاريخ الإصدار: {{ "" }}</div>
    </div>
    <img src="{{ url_for('static', filename='img/logo.png') }}">
  </div>
  <table class="print-table">
    {% if rows %}
    <thead><tr>{% for k in rows[0].keys() %}<th>{{ k }}</th>{% endfor %}</tr></thead>
    <tbody>
    {% for r in rows %}<tr>{% for v in r.values() %}<td>{{ v if v is not none else '-' }}</td>{% endfor %}</tr>{% endfor %}
    </tbody>
    {% endif %}
  </table>
</div>
</body>
</html>
