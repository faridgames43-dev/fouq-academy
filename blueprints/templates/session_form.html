{% extends "base.html" %}
{% block title %}حصة جديدة{% endblock %}
{% block page_title %}إنشاء حصة تدريبية{% endblock %}
{% block content %}
{% if not groups %}<div class="card" style="max-width:520px;border:1px solid #f4b4ae;">لا توجد مجموعات في النظام — أنشئ مجموعة أولًا من الإعدادات ثم أنشئ الحصة.</div>{% endif %}
<div class="card" style="max-width:520px;">
  <form method="post">
    <div class="field"><label>المجموعة</label>
      <select name="group_id" required>{% for gr in groups %}<option value="{{ gr.id }}">{{ gr.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>الموقع</label>
      <select name="facility_id">{% for f in facilities %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>التاريخ</label><input type="date" name="session_date" required></div>
    <div class="form-grid">
      <div class="field"><label>من</label><input type="time" name="start_time" value="17:00" required></div>
      <div class="field"><label>إلى</label><input type="time" name="end_time" value="18:30" required></div>
    </div>
    <div class="field"><label>هدف الحصة</label><input name="goal"></div>
    <button class="btn btn-primary btn-block" type="submit">حفظ</button>
  </form>
</div>
<script>(function(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);document.querySelector('input[name=session_date]').value=d.getFullYear()+'-'+m+'-'+dd;})();</script>
{% endblock %}
